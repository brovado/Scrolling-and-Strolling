<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Scrolling &amp; Strolling</title><link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
<header class="topbar"><div class="brand"><span class="brand-mark">⚔</span><span>SCROLLING &amp; STROLLING</span></div><button class="icon-button" aria-label="Menu">☰</button></header>
<section class="game-stage">
  <div class="combat-scene">
    <div class="scene-bg"><div class="sky"></div><div class="far-hills"></div><div class="near-ground"></div><div class="road"></div></div>
    <div class="fighter-stage player-stage"><div class="stage-model player-model">⚔️</div><div class="stage-name">WANDERER</div><div class="stage-hp"><i id="stage-player-hp"></i></div></div>
    <div class="fighter-stage enemy-stage"><div class="stage-model enemy-model" id="stage-enemy-model">?</div><div class="stage-name" id="stage-enemy-name">THE ROAD AHEAD</div><div class="stage-hp"><i id="stage-enemy-hp"></i></div></div>
    <div class="combat-ui"><span id="stage-mode">TRAVELING</span><span>Lv <b id="level">1</b></span></div>
    <div class="journey-line"><span></span><i></i><i></i><i></i><i></i></div>
  </div>
</section>
<section class="status-card"><div class="portrait">⚔</div><div class="status-main"><div class="status-name">WANDERER <span>Lv <b id="level-card">1</b></span></div><div class="bar-label">HP <b id="hp">40/40</b></div><div class="main-hp"><i id="main-hpbar"></i></div><div class="xp-row"><span>XP</span><div class="xpbar"><i id="xpbar"></i></div><b id="xp">0</b></div></div><div class="quick-stats"><span>⚔ <b id="attack">8</b></span><span>🛡 <b id="defense">3</b></span><span>⚡ <b id="speed">10</b></span></div></section>
<section class="content-card"><div class="event-head"><span id="mode">THE ROAD AHEAD</span><span class="road-dot">●</span></div><h1 id="event-title">A Long Road</h1><div id="event-text">Your journey begins.</div><div id="choices" class="choices"></div></section>
<nav class="bottom-nav"><button>☰<small>Menu</small></button><button>♙<small>Character</small></button><button class="home-button">⚔<small>Journey</small></button><button>🎒<small>Gear</small></button><button>✦<small>Skills</small></button></nav>
</main><script src="script.js"></script>
</body></html>
