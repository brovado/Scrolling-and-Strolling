<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scrolling &amp; Strolling</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <section class="world" aria-label="The road ahead">
      <div class="sky"></div><div class="far-hills"></div><div class="near-ground"></div><div class="road"></div>
      <div class="ronin" aria-label="Walking ronin">⚔</div>
    </section>
    <section class="panel">
      <div class="stats"><span>Honor <b id="honor">0</b></span><span>Skill <b id="skill">0</b></span><span>Fame <b id="fame">0</b></span></div>
      <div class="event"><p class="eyebrow">THE ROAD AHEAD</p><h1 id="event-title">A Long Road</h1><p id="event-text">The road stretches onward. What will you do?</p><div id="choices" class="choices"></div></div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
