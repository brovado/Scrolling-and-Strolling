<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Scrolling &amp; Strolling</title><link rel="stylesheet" href="style.css">
</head>
<body>
<main class="game">
<section class="world"><div class="sky"></div><div class="far-hills"></div><div class="near-ground"></div><div class="road"></div><div class="ronin">⚔</div></section>
<section class="panel">
<div class="stats"><span>Level <b id="level">1</b></span><span>HP <b id="hp">40/40</b></span><span>ATK <b id="attack">8</b></span><span>DEF <b id="defense">3</b></span><span>SPD <b id="speed">10</b></span></div>
<div class="event"><p class="eyebrow" id="mode">THE ROAD AHEAD</p><h1 id="event-title">A Long Road</h1><p id="event-text">Your journey begins.</p><div id="choices" class="choices"></div></div>
</section></main><script src="script.js"></script>
</body></html>
