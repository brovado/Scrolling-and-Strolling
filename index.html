<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Scrolling &amp; Strolling</title><link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <header class="topbar">
    <div class="brand"><span class="brand-mark">⚔</span><span>SCROLLING &amp; STROLLING</span></div>
    <button class="icon-button" id="character-button" aria-label="Character">☰</button>
  </header>
  <section class="journey" aria-label="Journey">
    <div class="scene"><div class="sky"></div><div class="far-hills"></div><div class="near-ground"></div><div class="road"></div><div class="ronin">⚔</div><div class="journey-caption">THE ROAD AHEAD</div></div>
  </section>
  <section class="status-card">
    <div class="portrait">⚔</div>
    <div class="status-main"><div class="status-name">WANDERER <span>Lv <b id="level">1</b></span></div><div class="bar-label">HP <b id="hp">40/40</b></div><div class="main-hp"><i id="main-hpbar"></i></div><div class="xp-row"><span>XP</span><div class="xpbar"><i id="xpbar"></i></div><b id="xp">0</b></div></div>
    <div class="quick-stats"><span>⚔ <b id="attack">8</b></span><span>🛡 <b id="defense">3</b></span><span>⚡ <b id="speed">10</b></span></div>
  </section>
  <section class="content-card">
    <div class="event-head"><span id="mode">THE ROAD AHEAD</span><span class="road-dot">●</span></div>
    <h1 id="event-title">A Long Road</h1>
    <div id="event-text">Your journey begins.</div>
    <div id="choices" class="choices"></div>
  </section>
  <nav class="bottom-nav" aria-label="Game menu"><button>☰<small>Menu</small></button><button>♙<small>Character</small></button><button class="home-button">⚔<small>Journey</small></button><button>🎒<small>Gear</small></button><button>✦<small>Skills</small></button></nav>
</main>
<script src="script.js"></script>
</body></html>
